[package]
name = "wcl-koppen"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Makes Köppen-Geiger climate zones from a World Climate Lab export"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zachhannum/wcl-koppen"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
